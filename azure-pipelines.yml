# Trigger pipeline on changes to the 'main' branch
trigger:
- main

# Define the pool of agents to run the pipeline on
pool:
  name: 'Default'

steps:
# Step 1: Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '18'
  displayName: 'Install Node.js'

# Step 2: Install project dependencies using npm ci
- script: npm ci
  displayName: 'Install dependencies'

# Step 3: Install Playwright browsers with necessary dependencies
- script: npx playwright install --with-deps
  displayName: 'Install Playwright browsers'

# Step 4: Run Playwright tests
- script: npx playwright test
  displayName: 'Run Playwright tests'
  env:
    CI: 'true'

# Step 5: Install .NET runtime so PublishTestResults can run
- task: UseDotNet@2
  displayName: 'Install .NET 6 runtime for PublishTestResults'
  inputs:
    packageType: runtime
    version: '6.x'
    includePreviewVersions: false

# Step 6: Publish the JUnit test results to the Azure DevOps "Tests" tab
- task: PublishTestResults@2
  displayName: 'Publish Test Results to Azure DevOps'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/test-results.xml'  # Path to the JUnit result file
    failTaskOnMissingResultsFile: true
    testRunTitle: 'Playwright Test Results'
  condition: always() # Always publish results, even if tests fail

# Step 7: Publish the Playwright HTML report as a pipeline artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright HTML report'
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
    publishLocation: 'pipeline'
  condition: always() # Always publish results, even if tests fail